name: Build release package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: python3 scripts/package.py google-reviews-for-wordpress-v1.3.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: installable-plugin
          path: google-reviews-for-wordpress-v1.3.0.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: google-reviews-for-wordpress-v1.3.0.zip
