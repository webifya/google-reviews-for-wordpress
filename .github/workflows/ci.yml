name: Menjar project checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        wordpress: ['6.4.7', 'latest']
        database: ['mysql', 'mariadb']
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.0' || 'mariadb:10.11' }}
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: grw_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
      - name: Build project-only package
        run: |
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 scripts/package.py /tmp/menjar-financial-reviews-v1.7.0.zip
      - name: Verify upgrade and fixed-project API behavior
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp.phar
          mkdir /tmp/wordpress
          php /tmp/wp.phar core download --path=/tmp/wordpress --version=${{ matrix.wordpress }}
          php /tmp/wp.phar config create --path=/tmp/wordpress --dbname=grw_test --dbuser=root --dbpass=test --dbhost=127.0.0.1:3306
          php /tmp/wp.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8097 --title=Test --admin_user=grwtest --admin_password=local-test-password-change --admin_email=test@example.invalid
          curl -fsSL https://github.com/webifya/google-reviews-for-wordpress/releases/download/v1.6.0-rc.1/google-reviews-for-wordpress-v1.6.0.zip -o /tmp/previous.zip
          unzip -q /tmp/previous.zip -d /tmp/wordpress/wp-content/plugins
          GRW_WP_ROOT=/tmp/wordpress GRW_SNAPSHOT=/tmp/menjar-snapshot.json php tests/menjar-baseline.php
          rm -rf /tmp/wordpress/wp-content/plugins/google-reviews-for-wordpress
          unzip -q /tmp/menjar-financial-reviews-v1.7.0.zip -d /tmp/wordpress/wp-content/plugins
          GRW_WP_ROOT=/tmp/wordpress GRW_SNAPSHOT=/tmp/menjar-snapshot.json php tests/menjar.php
      - uses: actions/upload-artifact@v4
        with:
          name: menjar-php-${{ matrix.php }}-wp-${{ matrix.wordpress }}-${{ matrix.database }}
          path: /tmp/menjar-financial-reviews-v1.7.0.zip
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring
      - run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium firefox webkit
      - run: bash scripts/browser-site.sh
      - name: Check the three project screens and live carousel
        run: |
          php -S 127.0.0.1:8097 -t /tmp/grw-browser/wordpress >/tmp/grw-server.log 2>&1 &
          sleep 2
          GRW_BROWSER=chromium node tests/menjar-browser.cjs
          GRW_BROWSER=firefox node tests/menjar-browser.cjs
          GRW_BROWSER=webkit node tests/menjar-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menjar-browser-results
          path: test-results/menjar/
